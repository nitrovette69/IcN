<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>SAR Image Viewer</title>\n    <style>\n        body { margin: 0; font-family: Arial, sans-serif; }\n        #canvas { border: 1px solid black; }\n        #controls { margin: 10px; }\n    </style>\n</head>\n<body>\n    <div id="controls">\n        <input type="file" id="fileInput">\n        <button id="panButton">Pan</button>\n        <button id="zoomInButton">Zoom In</button>\n        <button id="zoomOutButton">Zoom Out</button>\n    </div>\n    <canvas id="canvas"></canvas>\n    <script>\n        const fileInput = document.getElementById('fileInput');\n        const canvas = document.getElementById('canvas');\n        const ctx = canvas.getContext('2d');\n        let img = new Image();\n        let scale = 1;\n        let posX = 0, posY = 0;\n\n        fileInput.addEventListener('change', (event) => {\n            const file = event.target.files[0];\n            const reader = new FileReader();\n            reader.onload = (e) => {\n                img.src = e.target.result;\n            };\n            reader.readAsDataURL(file);\n        });\n\n        img.onload = () => {\n            canvas.width = img.width * scale;\n            canvas.height = img.height * scale;\n            ctx.drawImage(img, posX, posY, img.width * scale, img.height * scale);\n        };\n\n        function draw() {\n            ctx.clearRect(0, 0, canvas.width, canvas.height);\n            ctx.drawImage(img, posX, posY, img.width * scale, img.height * scale);\n        }\n\n        document.getElementById('panButton').addEventListener('click', () => {\n            // Implement pan functionality here\n        });\n\n        document.getElementById('zoomInButton').addEventListener('click', () => {\n            scale *= 1.2;\n            draw();\n        });\n\n        document.getElementById('zoomOutButton').addEventListener('click', () => {\n            scale /= 1.2;\n            draw();\n        });\n    <\/script>\n</body>\n</html>
